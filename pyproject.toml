[project]
name = "floodar"
version = "0.1.0"
description = "Interpret and explore DSM/DEM lidar rasters, with a focus on flood-risk analysis."
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "rasterio>=1.4",
    "numpy>=2.0",
    "scipy>=1.13",
    "matplotlib>=3.9",
    "shapely>=2.0",
    "typer>=0.12",
    "rich>=13.0",
]

[project.optional-dependencies]
notebooks = [
    "jupyterlab>=4.0",
    "ipykernel>=6.0",
    "folium>=0.17",
]
dev = [
    "pytest>=8.0",
]

[project.scripts]
floodar = "floodar.cli:app"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/floodar"]
